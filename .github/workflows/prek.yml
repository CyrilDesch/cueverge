name: Prek

# @what: runs every prek hook on the PR or push range. jj runs no git hook, so CI is the gate.
# @ref: @/prek.toml
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: prek-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prek:
    name: Pre-commit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: prek
      - name: Resolve diff range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            from=$(git merge-base "$BASE" "$HEAD"); to=$HEAD
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            from=$BEFORE; to=$SHA
          else
            from=$(git rev-parse HEAD~1); to=$SHA
          fi
          echo "args=--from-ref $from --to-ref $to" >> "$GITHUB_OUTPUT"
      # @why: CI takes the CUE release that mise.toml pins.
      # @ref: @/mise.toml
      # @why: the auto-fixer would rewrite files in CI. CI only reports, so it is off.
      - name: Run prek
        env:
          COMMENT_TAGS_AUTOFIX: "0"
        run: mise exec github:cue-lang/cue@0.18.0-rc.4 -- prek run --show-diff-on-failure --color=always ${{ steps.range.outputs.args }}
