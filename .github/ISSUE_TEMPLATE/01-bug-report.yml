name: Bug Report
description: File a bug report
title: "[BUG]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of cueverge are you using (`cueverge --version`, or the pin in mise.toml)?
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: cue-version
    attributes:
      label: CUE Version
      description: What version of CUE are you using (`cue version`)?
      placeholder: e.g. v0.18.0-rc.4
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen? Be specific about the expected outcome.
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What went wrong? Include error messages, the output of cue vet, or logs if relevant.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide a step by step guide to reproduce the issue. Include minimal CUE or commands, and any specific configuration or environment details needed.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Current Workaround
      description: If you've found a temporary solution, describe it here to help others encountering the same issue.
    validations:
      required: false
